[pytest]
# The suite lives in tests/; the deterministic helpers it exercises live in
# scripts/, put on the import path so tests can import them directly. The two
# helpers the portable `mkwp` skill owns and ships (`classify.py` and
# `mkwp_guard.py`) live inside that skill instead, so its own scripts directory
# joins the path beside the shared one.
testpaths = tests
pythonpath = scripts skills/mkwp/scripts
