[pytest]
# The suite lives in tests/; the deterministic helpers it exercises live inside
# the skills that own and ship them, put on the import path so tests can import
# them directly. The transfer engine's helpers belong to `clone`
# (`skills/clone/scripts/`), and the two the `mkwp` skill drives belong to it
# (`skills/mkwp/scripts/`); the plugin root keeps only the manual-page
# renderer, whose own consistency suite imports it from there.
testpaths = tests
pythonpath = skills/clone/scripts skills/mkwp/scripts scripts
